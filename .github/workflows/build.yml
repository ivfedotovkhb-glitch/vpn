name: Build AntiBlock APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout builder repo
        uses: actions/checkout@v4

      - name: Clone Tor/Orbot source
        run: |
          git clone --depth 1 --branch 17.9.5-RC-4-tor-0.4.9.11 https://github.com/guardianproject/orbot-android.git orbot

      - name: Apply AntiBlock defaults, branding and transport selector
        run: |
          cp patches/SmartConnect.kt orbot/app/src/main/java/org/torproject/android/service/circumvention/SmartConnect.kt
          cd orbot
          python3 - <<'PY'
          from pathlib import Path
          import re

          for p in Path('app/src').rglob('strings.xml'):
              s = p.read_text(encoding='utf-8')
              s = re.sub(r'(<string\s+name="app_name"[^>]*>).*?(</string>)', r'\1AntiBlock\2', s)
              p.write_text(s, encoding='utf-8')

          prefs = Path('app/src/main/java/org/torproject/android/util/Prefs.kt')
          s = prefs.read_text(encoding='utf-8')
          old = 'get() = cr?.getPrefBoolean(PREF_USE_SMART_CONNECT) ?: false'
          new = 'get() = cr?.getPrefBoolean(PREF_USE_SMART_CONNECT) ?: true'
          if old not in s:
              raise SystemExit('Smart Connect default pattern not found')
          prefs.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle
          cache-dependency-path: orbot/**/*.gradle*

      - name: Build full-permission APK
        working-directory: orbot
        run: |
          chmod +x gradlew
          ./gradlew assembleFullpermDebug

      - name: Collect APK
        run: |
          mkdir -p out
          APK="$(find orbot/app/build/outputs/apk -type f -name '*.apk' | grep -i fullperm | head -n1)"
          test -n "$APK"
          cp "$APK" out/AntiBlock-v2.apk
          sha256sum out/AntiBlock-v2.apk | tee out/SHA256.txt
          ls -lh out/AntiBlock-v2.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AntiBlock-v2-APK
          path: out/
          retention-days: 3
